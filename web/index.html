<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#5b21b6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Theater Notes" />
  <title>Theater Notes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1 id="header-title">Theater Notes</h1>
      <div id="header-actions"></div>
    </header>

    <main id="app-content"></main>

    <nav id="tab-bar">
      <button class="tab" data-tab="record">
        <span class="tab-icon">🎙️</span>
        <span class="tab-label">Record</span>
      </button>
      <button class="tab" data-tab="cast">
        <span class="tab-icon">🎭</span>
        <span class="tab-label">Cast</span>
      </button>
      <button class="tab" data-tab="history">
        <span class="tab-icon">🕑</span>
        <span class="tab-label">History</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
